<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <div class="container">
      <header>
        <h1 class="title">
          <a class="active" href="Login.html">Login</a>
          |
          <a class="link" href="Registration.html">Register</a>
        </h1>

        <p class="description">Enter your username and password to login.</p>
      </header>

      <section>
        <form action="#" method="post">
          <p>
            <input
              class="input"
              type="text"
              name="username"
              placeholder="Username"
              required
            />
          </p>

          <p>
            <input
              class="input"
              type="password"
              name="password"
              placeholder="Password"
              required
            />
          </p>

          <p>
            <button class="button" type="submit">Login</button>
          </p>
        </form>
      </section>

      <footer>
        <p class="or">Or login with</p>

        <p>
          <button class="social" type="button">
            <img src="images/google.svg" alt="Google" width="18" />
            Continue with Google
          </button>
        </p>

        <p>
          <button class="social" type="button">
            <img src="images/facebook.svg" alt="Facebook" width="18" />
            Continue with Facebook
          </button>
        </p>
      </footer>
    </div>
  </body>
</html>
